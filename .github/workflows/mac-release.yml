name: Build and Publish macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-app:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop dependencies
        run: |
          cd desktop
          npm install

      - name: Package macOS App
        run: |
          chmod +x scripts/package_mac_app.sh
          ./scripts/package_mac_app.sh

      - name: Build DMG and ZIP distribution archives
        run: |
          mkdir -p dist
          hdiutil create -volname "Findra" -srcfolder dist/Findra.app -ov -format UDZO dist/Findra-mac-arm64.dmg
          ditto -c -k --sequesterRsrc --keepParent dist/Findra.app dist/Findra-mac-arm64.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/Findra-mac-arm64.dmg
            dist/Findra-mac-arm64.zip
          generate_release_notes: true
