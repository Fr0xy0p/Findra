<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Findra Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="browser-chrome">
    <!-- ROW 1: TABS BAR -->
    <div id="tab-bar-container">
      <div id="traffic-light-spacer"></div>
      <div id="tab-strip"></div>
      <button id="btn-new-tab" class="new-tab-btn" title="New Tab (Cmd+T)">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- ROW 2: NAVIGATION TOOLBAR -->
    <div id="nav-toolbar">
      <!-- Navigation controls -->
      <div class="nav-cluster">
        <button id="btn-back" class="nav-btn" title="Back (Cmd+[)">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="btn-forward" class="nav-btn" title="Forward (Cmd+])">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button id="btn-reload" class="nav-btn" title="Reload (Cmd+R)">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button id="btn-bookmark" class="nav-btn" title="Bookmark This Page">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
      </div>

      <!-- Omnibox (Search & Address Bar) -->
      <div id="omnibox-wrapper">
        <div id="omnibox-box">
          <span id="omnibox-icon">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input
            id="omnibox-input"
            type="text"
            placeholder="Search Findra or type a URL"
            spellcheck="false"
            autocomplete="off"
          />
          <div class="omnibox-right-badges">
            <!-- Shield Lion Badge inside Omnibox -->
            <span id="omnibox-shield-badge" class="omnibox-badge" title="Findra Shield Active">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="#fb542b">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
              </svg>
            </span>
            <!-- Rewards Triangle Badge inside Omnibox -->
            <span id="omnibox-rewards-badge" class="omnibox-badge rewards-badge" title="Findra Rewards">
              <svg viewBox="0 0 24 24" width="13" height="13">
                <defs>
                  <linearGradient id="rewards-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ec4899"/>
                    <stop offset="100%" stop-color="#f43f5e"/>
                  </linearGradient>
                </defs>
                <polygon points="12 3 22 20 2 20" fill="url(#rewards-grad)"/>
              </svg>
            </span>
          </div>
        </div>
        <!-- Real-time Suggestion Dropdown -->
        <div id="suggestions-menu" class="hidden"></div>
      </div>

      <!-- Action cluster: Brave Icons (Extensions, Media, Sidebar, Downloads, Shield, Menu) -->
      <div class="action-cluster">
        <button id="btn-extensions" class="nav-btn" title="Extensions">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5a2.5 2.5 0 0 1 0 5H2v4c0 1.1.9 2 2 2h3.8v-1.5a2.5 2.5 0 0 1 5 0V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>
        </button>

        <button id="btn-media" class="nav-btn" title="Media Controls">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>

        <button id="btn-sidepanel" class="nav-btn" title="Toggle Findra Assistant (Cmd+B)">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="1.8" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>

        <button id="btn-downloads" class="nav-btn" title="Downloads">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>

        <!-- Brave Shield Icon Button with Live Counter Badge -->
        <button id="btn-shield" class="shield-btn" title="Findra Shields (Ad & Tracker Blocker)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="#fb542b">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
          </svg>
          <span id="shield-badge" class="shield-count-pill">0</span>
        </button>

        <!-- Hamburger Menu -->
        <button id="btn-menu" class="nav-btn" title="Customize and control Findra">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- ROW 3: BOOKMARKS BAR -->
    <div id="bookmarks-bar">
      <!-- 4-dots grid icon (All Bookmarks / Apps) -->
      <button id="btn-bookmarks-grid" class="bookmarks-grid-btn" title="All Bookmarks & Apps">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <circle cx="5" cy="5" r="2.5"/><circle cx="12" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/>
          <circle cx="5" cy="12" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/>
          <circle cx="5" cy="19" r="2.5"/><circle cx="12" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/>
        </svg>
      </button>

      <!-- Bookmarks List Matching Screenshot -->
      <div id="bookmarks-list">
        <button class="bookmark-chip" data-url="https://enggroom.com" title="enggroom">
          <span class="bm-icon" style="color: #22c55e;">⬡</span>
          <span class="bm-title">enggroom</span>
        </button>

        <button class="bookmark-chip" data-url="https://codeforces.com" title="Codeforces home">
          <span class="bm-icon" style="color: #ef4444;">∐</span>
          <span class="bm-title">Codeforces home</span>
        </button>

        <button class="bookmark-chip" data-url="https://pokemonbandit.com" title="pokemon bandit">
          <span class="bm-icon" style="color: #06b6d4;">◉</span>
          <span class="bm-title">pokemon bandit</span>
        </button>

        <button class="bookmark-chip" data-url="https://newtonschool.co" title="Newton School">
          <span class="bm-icon" style="color: #3b82f6;">◆</span>
          <span class="bm-title">Newton School</span>
        </button>
      </div>
    </div>
  </div>

  <!-- CLOUD CONFIG MODAL -->
  <div id="cloud-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="#38bdf8" stroke-width="2" fill="none"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
          <span>Findra Cloud Service Settings</span>
        </div>
        <button id="btn-close-cloud-modal" class="modal-close">&times;</button>
      </div>
      <p class="modal-desc">
        Connect Findra directly to your live cloud host (e.g. Render, Railway, Cloud Run) so you never need to run localhost.
      </p>
      <div class="modal-input-group">
        <label for="cloud-url-input">Cloud Search Engine URL:</label>
        <input type="url" id="cloud-url-input" placeholder="https://findra-q4pt.onrender.com" />
      </div>
      <div class="modal-actions">
        <button id="btn-reset-cloud-url" class="btn-modal-secondary">Reset to Default</button>
        <button id="btn-save-cloud-url" class="btn-modal-primary">Save & Connect</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
