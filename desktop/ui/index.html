<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Findra Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="browser-chrome">
    <!-- ROW 1: TABS BAR -->
    <div id="tab-bar-container">
      <div id="traffic-light-spacer"></div>
      <div id="tab-strip"></div>
      <button id="btn-new-tab" class="new-tab-btn" title="New Tab (Cmd+T)">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- ROW 2: NAVIGATION TOOLBAR -->
    <div id="nav-toolbar">
      <!-- Navigation controls -->
      <div class="nav-cluster">
        <button id="btn-back" class="nav-btn" title="Back (Cmd+[)">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button id="btn-forward" class="nav-btn" title="Forward (Cmd+])">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <button id="btn-reload" class="nav-btn" title="Reload (Cmd+R)">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button id="btn-home" class="nav-btn" title="Findra Search Home">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
        </button>
      </div>

      <!-- Omnibox (Search & Address Bar) -->
      <div id="omnibox-wrapper">
        <div id="omnibox-box">
          <span id="omnibox-icon">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          </span>
          <input
            id="omnibox-input"
            type="text"
            placeholder="Search Findra or enter address..."
            spellcheck="false"
            autocomplete="off"
          />
        </div>
        <!-- Real-time Suggestion Dropdown -->
        <div id="suggestions-menu" class="hidden"></div>
      </div>

      <!-- Action cluster: Quick Shortcuts, New Tab & Findra AI Sidebar -->
      <div class="action-cluster">
        <button id="btn-toolbar-new-tab" class="action-btn-newtab" title="Open New Tab (Cmd+T)">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>New Tab</span>
        </button>
        <button id="btn-quick-yt" class="quick-btn" title="Open YouTube in this tab">
          <span class="yt-badge">▶</span>
          <span>YouTube</span>
        </button>
        <button id="btn-sidepanel" class="action-btn" title="Toggle Findra Assistant (Cmd+B)">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
          <span>Findra AI</span>
        </button>
        <button id="btn-cloud-config" class="action-btn cloud-btn" title="Configure Cloud URL (Cmd+,)">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
          <span>Cloud</span>
        </button>
      </div>
    </div>
  </div>

  <!-- CLOUD CONFIG MODAL -->
  <div id="cloud-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="#38bdf8" stroke-width="2" fill="none"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
          <span>Findra Cloud Service Settings</span>
        </div>
        <button id="btn-close-cloud-modal" class="modal-close">&times;</button>
      </div>
      <p class="modal-desc">
        Connect Findra directly to your live cloud host (e.g. Render, Railway, Cloud Run) so you never need to run localhost.
      </p>
      <div class="modal-input-group">
        <label for="cloud-url-input">Cloud Search Engine URL:</label>
        <input type="url" id="cloud-url-input" placeholder="https://findra.onrender.com" />
      </div>
      <div class="modal-actions">
        <button id="btn-reset-cloud-url" class="btn-modal-secondary">Reset to Default</button>
        <button id="btn-save-cloud-url" class="btn-modal-primary">Save & Connect</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
